name: products
connection: coffeehouse_duckdb
table: products
grain: [product_id]
description: "One row per product in the catalogue."

columns:
  - { name: product_id, type: int,     nullable: false }
  - { name: name,       type: string,  nullable: false }
  - { name: category,   type: string,  nullable: false }
  - { name: unit_price, type: decimal, nullable: false }

dimensions:
  - { name: product_name, column: name,     label: "Product" }
  - { name: category,     column: category, label: "Category", aliases: ["product category"] }

meta:
  provenance: human_curated
