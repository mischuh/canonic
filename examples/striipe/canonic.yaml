version: 1
project:
  name: striipe
  default_connection: warehouse_pg
connections:
- id: warehouse_pg
  type: postgres
  params:
    host: localhost
    port: 5432
    user: postgres
    dbname: postgres
  credentials_ref: env:CANONIC_PG_PASS
  rls_enforced: false
embeddings:
  model: all-MiniLM-L6-v2
telemetry:
  enabled: false
  transport_acknowledged: false
reconcile:
  auto_apply:
    enabled: false
    min_confidence: 0.95
    max_provenance: inferred
    never:
    - grain
    - joins
    - measures
  strict_contradictions: false
feedback:
  pattern_min_count: 2
  pattern_window_days: 90
  pattern_min_markers: 1
  trust_cap_window_days: 90
runtime:
  air_gapped: false
  allow_cidrs: []
logging:
  level: WARNING
  format: text
  max_bytes: 52428800
  backup_count: 5
instrumentation:
  events:
    max_bytes: 52428800
    compress: true
mcp:
  auth:
    tokens: []
  tasks:
    enabled: false
    backend: memory
  cache_ttl_seconds: 300
