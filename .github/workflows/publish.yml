name: publish

# Fires when release-please merges a Release PR and pushes the resulting
# version tag (see .github/workflows/release-please.yml).
on:
  push:
    tags:
      - "v*.*.*"

jobs:
  pypi-publish:
    # Uses PyPI Trusted Publishing (OIDC) — no token secret needed, but the
    # `pypi` environment and a pending trusted publisher must be configured on
    # PyPI first (one-time maintainer setup, see SETUP.md).
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Build
        run: uv build

      - name: Publish to PyPI
        run: uv publish

  mcp-registry-publish:
    # Publishes server.json to the official MCP Registry. Its `version` is kept
    # in sync with the PyPI release via release-please's `extra-files` (see
    # release-please-config.json), so this job just needs PyPI to be live first.
    needs: pypi-publish
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      - name: Authenticate to MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Publish server.json to MCP Registry
        run: ./mcp-publisher publish

  docker-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/mischuh/canonic:${{ github.ref_name }}
            ghcr.io/mischuh/canonic:latest
