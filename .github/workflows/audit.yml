name: audit

# Kept out of ci.yml on purpose: a newly published advisory should not turn every
# unrelated pull request red. It runs when dependencies change and once a week.
on:
  push:
    branches: [main]
    paths: [uv.lock, pyproject.toml]
  pull_request:
    paths: [uv.lock, pyproject.toml]
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

jobs:
  pip-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Export locked dependencies
        run: uv export --frozen --no-hashes --no-emit-project --group dev -o requirements-audit.txt

      # The filelock advisories are ignored until fakesnow supports snowflake-connector-python 5,
      # the first connector release that allows filelock 4. Remove them with #517.
      - name: Audit for known vulnerabilities
        run: >-
          uvx pip-audit -r requirements-audit.txt --no-deps --disable-pip
          --ignore-vuln CVE-2026-112907
          --ignore-vuln CVE-2026-112909
          --ignore-vuln CVE-2026-112910
          --ignore-vuln CVE-2026-112913
          --ignore-vuln CVE-2026-112915
          --ignore-vuln CVE-2026-112935
          --ignore-vuln CVE-2026-112936
          --ignore-vuln CVE-2026-112939
          --ignore-vuln CVE-2026-112940
