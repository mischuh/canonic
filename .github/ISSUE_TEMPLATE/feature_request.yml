name: Feature request
description: Suggest an idea, a new connector/dialect, or a workflow improvement.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: The situation you're in today, and where canonic falls short.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What you'd like canonic to do instead. Sketches, example CLI invocations, or config snippets are welcome.
    validations:
      required: false
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any workarounds you're using today, or other tools you compared against.
    validations:
      required: false
